name: Feature request
description: Suggest a privacy-preserving Windows desktop improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What viewing problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy and failure behavior
      description: What is captured or transmitted, and how does it fail open?
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This does not require bypassing DRM, protected surfaces, access controls, or provider restrictions.
          required: true
